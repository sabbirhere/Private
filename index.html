<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlaZe Share</title>
<meta name="theme-color" content="#7c5cff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6aa8'/%3E%3Cstop offset='.55' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M32 11C32 11 18 27 18 37a14 14 0 0 0 28 0C46 27 32 11 32 11Z' fill='white' fill-opacity='.94'/%3E%3Cpath d='M25 34h14m-4-4 4 4-4 4M39 42H25m4-4-4 4 4 4' fill='none' stroke='%237c5cff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' transform='translate(0 -1)'/%3E%3Cellipse cx='22' cy='15' rx='11' ry='5' fill='white' fill-opacity='.28' transform='rotate(-24 22 15)'/%3E%3C/svg%3E">
<style>
  :root {
    --pink: #ff6aa8; --violet: #7c5cff; --cyan: #22d3ee; --peach: #ffb86b;
    --ink: #1e1b3a; --muted: #6b6890;
    --bg1: #fff1f7; --bg2: #eef3ff; --bg3: #e9fbff;
    --glass: rgba(255,255,255,.62); --glass-b: rgba(255,255,255,.85);
    --field: rgba(255,255,255,.7);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f4f2ff; --muted: #a9a6d0;
      --bg1: #1a1030; --bg2: #101634; --bg3: #0b2130;
      --glass: rgba(30,26,64,.55); --glass-b: rgba(255,255,255,.14);
      --field: rgba(255,255,255,.08);
    }
  }
  * { box-sizing: border-box; }
  /* no text selection / copying of page content (the code input stays usable) */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input[type=text] { -webkit-user-select: text; user-select: text; }
  img, svg { -webkit-user-drag: none; pointer-events: none; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink);
    font: 16px/1.5 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; justify-content: center; align-items: center; padding: 12px 16px;
  }

  /* floating glaze blobs */
  .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .55; z-index: 0; pointer-events: none; animation: float 14s ease-in-out infinite; }
  .b1 { width: 340px; height: 340px; background: var(--pink); top: -90px; left: -80px; }
  .b2 { width: 300px; height: 300px; background: var(--cyan); bottom: -80px; right: -60px; animation-delay: -5s; }
  .b3 { width: 240px; height: 240px; background: var(--peach); top: 45%; right: 12%; opacity: .35; animation-delay: -9s; }
  @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-26px) scale(1.08); } }

  main { position: relative; z-index: 1; width: 100%; max-width: 400px; max-height: 100%; }

  /* staggered lazy-reveal */
  .rise { opacity: 0; transform: translateY(14px); filter: blur(6px); animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i, 0) * 110ms + 80ms); }
  @keyframes rise { to { opacity: 1; transform: none; filter: none; } }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo { width: 46px; height: 46px; flex: none; filter: drop-shadow(0 8px 14px rgba(124,92,255,.35)); animation: bob 5s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
  h1 { font-size: 26px; line-height: 1.1; margin: 0; font-weight: 800; letter-spacing: -.02em;
       background: linear-gradient(90deg, var(--pink), var(--violet) 55%, var(--cyan)); background-size: 200% 100%;
       -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 6s linear infinite; }
  @keyframes sheen { to { background-position: -200% 0; } }
  .tag { margin: 0 0 clamp(8px, 2vh, 18px); color: var(--muted); font-size: 14px; }

  .card {
    position: relative; margin-bottom: clamp(8px, 1.6vh, 14px); padding: clamp(10px, 1.8vh, 16px);
    background: var(--glass); border: 1px solid var(--glass-b); border-radius: 22px;
    backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 10px 30px rgba(80,60,160,.12), inset 0 1px 0 rgba(255,255,255,.6);
  }
  h2 { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* segmented control */
  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 16px; background: var(--field); border: 1px solid var(--glass-b); margin-bottom: clamp(8px, 1.6vh, 14px); }
  .seg::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 12px;
    background: linear-gradient(135deg, var(--pink), var(--violet)); box-shadow: 0 6px 16px rgba(124,92,255,.4);
    transition: transform .35s cubic-bezier(.3,.8,.2,1); }
  .seg[data-mode="drop"]::before { transform: translateX(100%); }
  .seg button { position: relative; z-index: 1; border: 0; background: none; padding: 9px 0; font: inherit; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; transition: color .25s; }
  .seg button.on { color: #fff; }

  /* drop zone */
  .zone { display: block; text-align: center; padding: clamp(10px, 2.4vh, 22px) 12px; border-radius: 16px; cursor: pointer;
    border: 2px dashed color-mix(in srgb, var(--violet) 45%, transparent); background: var(--field);
    transition: transform .2s, border-color .2s, background .2s; }
  .zone:hover, .zone.over { transform: translateY(-2px); border-color: var(--pink); }
  .zone b { display: block; font-size: 15px; }
  .zone span { font-size: 13px; color: var(--muted); word-break: break-all; }
  .zone .plus { display: inline-grid; place-items: center; width: 34px; height: 34px; margin-bottom: 2px; border-radius: 50%; color: #fff; font-size: 22px; line-height: 1;
    background: linear-gradient(135deg, var(--cyan), var(--violet)); box-shadow: 0 6px 14px rgba(34,211,238,.4); }
  input[type=file] { display: none; }

  #share { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 10px; animation: pop .5s cubic-bezier(.3,1.4,.4,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.88) translateY(8px); } }
  #qr img { width: clamp(96px, 19vh, 150px); height: clamp(96px, 19vh, 150px); display: block; background: #fff; padding: 7px; border-radius: 16px; box-shadow: 0 10px 26px rgba(124,92,255,.28); }
  #code { font: 800 26px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .22em; padding-left: .22em;
    background: linear-gradient(90deg, var(--pink), var(--violet), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; font: 800 20px ui-monospace, Menlo, monospace; letter-spacing: .2em; text-align: center; text-transform: uppercase;
    padding: 10px; border-radius: 14px; border: 1px solid var(--glass-b); background: var(--field); color: var(--ink); outline: none; transition: box-shadow .2s; }
  input[type=text]:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--violet) 40%, transparent); }
  input::placeholder { color: var(--muted); opacity: .5; letter-spacing: .2em; }
  .btn { border: 0; cursor: pointer; font: inherit; font-weight: 700; padding: 0 18px; border-radius: 14px; color: #fff;
    background: linear-gradient(135deg, var(--violet), var(--cyan)); box-shadow: 0 6px 16px rgba(124,92,255,.35); transition: transform .15s, box-shadow .15s; }
  .btn:hover { transform: translateY(-1px); } .btn:active { transform: scale(.96); }
  .btn.alt { background: var(--field); color: var(--ink); box-shadow: none; border: 1px solid var(--glass-b); }
  video { width: 100%; max-height: 18vh; object-fit: cover; margin-top: 8px; border-radius: 14px; }

  /* status + progress */
  .bar { height: 6px; border-radius: 99px; background: var(--field); overflow: hidden; margin-top: 4px; opacity: 0; transition: opacity .3s; }
  .bar.on { opacity: 1; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--pink), var(--violet), var(--cyan)); transition: width .15s; }
  #status { min-height: 1.6em; margin-top: 8px; font-size: 14px; color: var(--muted); text-align: center; }
  footer { margin-top: 10px; text-align: center; font-size: 12px; color: var(--muted); opacity: .8; }
  [hidden] { display: none !important; }
  @media (max-height: 700px) { footer { display: none; } }
  @media (max-height: 600px) { .tag { display: none; } .logo { width: 36px; height: 36px; } h1 { font-size: 22px; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<main>
  <header class="rise" style="--i:0">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff6aa8"/><stop offset=".55" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
      </linearGradient></defs>
      <rect width="64" height="64" rx="18" fill="url(#g)"/>
      <path d="M32 11C32 11 18 27 18 37a14 14 0 0 0 28 0C46 27 32 11 32 11Z" fill="#fff" fill-opacity=".94"/>
      <path d="M25 34h14m-4-4 4 4-4 4M39 42H25m4-4-4 4 4 4" fill="none" stroke="#7c5cff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -1)"/>
      <ellipse cx="22" cy="15" rx="11" ry="5" fill="#fff" fill-opacity=".28" transform="rotate(-24 22 15)"/>
    </svg>
    <h1>GlaZe Share</h1>
  </header>
  <p class="tag rise" style="--i:1">Send files device to device. Smooth, direct, no accounts.</p>

  <div class="seg rise" style="--i:2" id="seg" data-mode="live">
    <button id="tLive" class="on">Live · P2P</button>
    <button id="tDrop">Drop · 24h</button>
  </div>

  <section class="card rise" style="--i:3">
    <h2>Send</h2>
    <label class="zone" id="zone">
      <input type="file" id="file">
      <div class="plus">+</div>
      <b id="zoneT">Choose or drop a file</b>
      <span id="zoneN">Get a code and QR to share</span>
    </label>
    <div id="share" hidden>
      <div id="qr"></div>
      <div id="code"></div>
    </div>
  </section>

  <section class="card rise" style="--i:4">
    <h2>Receive</h2>
    <div class="row">
      <input type="text" id="enter" maxlength="6" placeholder="CODE" autocomplete="off">
      <button class="btn" id="go">Get</button>
      <button class="btn alt" id="scan" hidden>Scan</button>
    </div>
    <video id="cam" hidden playsinline muted></video>
  </section>

  <div class="bar rise" style="--i:5" id="bar"><i id="barI"></i></div>
  <div id="status" class="rise" style="--i:5"></div>
  <footer class="rise" style="--i:6">Live mode goes straight between devices. Drop keeps a file for 24 hours.</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ---------- CONFIG ----------
// URL of your Cloudflare Worker (see worker.js). Leave empty to disable Drop.
const DROP_URL = "";   // e.g. "https://drop.yourname.workers.dev"

// STUN first (direct P2P). If that fails, ICE automatically falls back to TURN.
// The Open Relay credentials below are a public free tier; replace with your own for reliability.
const ICE = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:global.stun.twilio.com:3478" },
  { urls: ["turn:openrelay.metered.ca:80", "turn:openrelay.metered.ca:443",
           "turn:openrelay.metered.ca:443?transport=tcp"],
    username: "openrelayproject", credential: "openrelayproject" }
];
// ----------------------------

const $ = id => document.getElementById(id);
// Block copying, selecting, right-click menu and dragging of page content (typing/pasting in the code box still works)
["copy", "cut", "contextmenu", "selectstart", "dragstart"].forEach(ev =>
  document.addEventListener(ev, e => { if (e.target.tagName !== "INPUT") e.preventDefault(); }));
const status = t => $("status").textContent = t;
const ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => ALPHA[b % ALPHA.length]).join("");
const PREFIX = "ftp2p-";
const CHUNK = 16 * 1024;
let mode = "live", peer;

const fmt = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.ceil(b / 1e3) + " KB";
const pageUrl = tag => location.protocol.startsWith("http")
  ? location.origin + location.pathname + "#" + tag
  : tag; // opened as a local file: a link would be useless to the other device, so the QR holds just the code

function prog(done, total) {
  $("bar").classList.add("on");
  $("barI").style.width = (total ? Math.min(100, done / total * 100) : 0) + "%";
}
function progOff() { setTimeout(() => $("bar").classList.remove("on"), 1500); }

$("tLive").onclick = () => setMode("live");
$("tDrop").onclick = () => setMode("drop");
function setMode(m) {
  mode = m;
  $("seg").dataset.mode = m;
  $("tLive").classList.toggle("on", m === "live");
  $("tDrop").classList.toggle("on", m === "drop");
  $("share").hidden = true;
  status(m === "drop" && !DROP_URL ? "Drop is not configured (set DROP_URL)." : "");
}

function showShare(code, tag) {
  const qr = qrcode(0, "M"); qr.addData(pageUrl(tag)); qr.make();
  $("qr").innerHTML = qr.createImgTag(6, 0);
  $("code").textContent = code;
  $("share").hidden = false;
  $("share").style.animation = "none"; void $("share").offsetWidth; $("share").style.animation = "";
}

function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

// ---------- SEND ----------
function picked(f) {
  if (!f) return;
  $("zoneT").textContent = f.name;
  $("zoneN").textContent = fmt(f.size) + " · tap to change";
  mode === "live" ? sendLive(f) : sendDrop(f);
}
$("file").onchange = () => picked($("file").files[0]);
["dragenter", "dragover"].forEach(e => $("zone").addEventListener(e, ev => { ev.preventDefault(); $("zone").classList.add("over"); }));
["dragleave", "drop"].forEach(e => $("zone").addEventListener(e, ev => { ev.preventDefault(); $("zone").classList.remove("over"); }));
$("zone").addEventListener("drop", ev => picked(ev.dataTransfer.files[0]));

function sendLive(file) {
  if (peer) peer.destroy();
  const code = rnd(6);
  peer = new Peer(PREFIX + code, { config: { iceServers: ICE } });
  peer.on("open", () => { showShare(code, code); status("Waiting for the other device…"); });
  peer.on("error", e => status("Error: " + e.type));
  peer.on("connection", conn => {
    conn.on("open", async () => {
      status("Connected. Sending…");
      const dc = conn.dataChannel;
      conn.send(JSON.stringify({ name: file.name, size: file.size, type: file.type }));
      let sent = 0;
      while (sent < file.size) {
        const buf = await file.slice(sent, sent + CHUNK).arrayBuffer();
        while (dc.bufferedAmount > 1e6) await new Promise(r => setTimeout(r, 20));
        conn.send(buf);
        sent += buf.byteLength;
        status(`Sending ${fmt(sent)} / ${fmt(file.size)}`);
        prog(sent, file.size);
      }
      conn.send("done");
      status("Sent. " + route(conn)); progOff();
    });
  });
}

async function sendDrop(file) {
  if (!DROP_URL) return status("Drop is not configured (set DROP_URL).");
  status("Uploading…"); prog(0, 1);
  try {
    const r = await fetch(DROP_URL + "/drop", {
      method: "POST", body: file,
      headers: { "x-filename": encodeURIComponent(file.name) }
    });
    if (!r.ok) throw new Error(await r.text());
    const { code } = await r.json();
    showShare(code, "d-" + code);
    prog(1, 1); status("Stored for 24 hours."); progOff();
  } catch (e) { status("Upload failed: " + e.message); progOff(); }
}

// ---------- RECEIVE ----------
$("go").onclick = () => receive($("enter").value.trim().toUpperCase());
$("enter").onkeydown = e => { if (e.key === "Enter") $("go").click(); };

function receive(code) {
  if (!code) return;
  if (code.startsWith("D-")) return receiveDrop(code.slice(2));
  if (mode === "drop") return receiveDrop(code);
  receiveLive(code);
}

function receiveLive(code) {
  if (peer) peer.destroy();
  status("Connecting…");
  peer = new Peer({ config: { iceServers: ICE } });
  peer.on("error", e => status("Error: " + e.type));
  peer.on("open", () => {
    const conn = peer.connect(PREFIX + code, { reliable: true, serialization: "raw" });
    let meta, chunks = [], got = 0;
    conn.on("data", d => {
      if (typeof d === "string") {
        if (d === "done") {
          saveBlob(new Blob(chunks, { type: meta.type }), meta.name);
          status("Received " + meta.name + ". " + route(conn)); progOff(); return;
        }
        meta = JSON.parse(d); return;
      }
      chunks.push(d); got += d.byteLength;
      status(`Receiving ${fmt(got)} / ${fmt(meta.size)}`);
      prog(got, meta.size);
    });
  });
}

async function receiveDrop(code) {
  if (!DROP_URL) return status("Drop is not configured (set DROP_URL).");
  status("Downloading…"); prog(0, 1);
  try {
    const r = await fetch(DROP_URL + "/drop/" + code);
    if (!r.ok) { progOff(); return status("Not found or expired."); }
    const name = decodeURIComponent(r.headers.get("x-filename") || "file");
    saveBlob(await r.blob(), name);
    prog(1, 1); status("Downloaded " + name); progOff();
  } catch (e) { status("Download failed: " + e.message); progOff(); }
}

// Reports whether the link is direct or relayed through TURN
function route(conn) {
  conn.peerConnection.getStats().then(s => {
    s.forEach(r => {
      if (r.type === "candidate-pair" && r.state === "succeeded" && r.nominated) {
        const l = s.get(r.localCandidateId);
        if (l) status($("status").textContent.replace(/ ?(direct|via relay)$/, "") +
          (l.candidateType === "relay" ? " via relay" : " direct"));
      }
    });
  });
  return "";
}

// ---------- QR SCAN (Chrome/Android; other devices: use the camera app) ----------
if ("BarcodeDetector" in window) {
  $("scan").hidden = false;
  $("scan").onclick = async () => {
    const v = $("cam"), det = new BarcodeDetector({ formats: ["qr_code"] });
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    v.hidden = false; await v.play();
    const tick = async () => {
      const [hit] = await det.detect(v).catch(() => []);
      if (hit) {
        v.srcObject.getTracks().forEach(t => t.stop()); v.hidden = true;
        const tag = hit.rawValue.split("#")[1] || hit.rawValue;
        return receive(tag.toUpperCase());
      }
      requestAnimationFrame(tick);
    };
    tick();
  };
}

// Opened from a QR link: auto-receive
if (location.hash.length > 1) {
  const tag = location.hash.slice(1).toUpperCase();
  $("enter").value = tag.replace(/^D-/, "");
  receive(tag);
}
</script>
</body>
</html>
